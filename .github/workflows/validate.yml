name: validate

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check JSON syntax
        run: |
          for f in config/*.json .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json; do
            jq empty "$f"
          done

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate marketplace and plugins
        run: |
          claude --version
          claude plugin validate . --strict
          for p in plugins/*/; do
            claude plugin validate "$p" --strict
          done

      # claude doctor exits 0 even when it reports invalid settings.
      - name: Check the settings as installed
        shell: bash
        run: |
          sudo mkdir -p /etc/claude-code/managed-settings.d
          sudo ln -s "$GITHUB_WORKSPACE/config/settings.json" /etc/claude-code/managed-settings.d/50-claude-code-config.json
          sudo ln -s "$GITHUB_WORKSPACE/config/sandbox.json" /etc/claude-code/managed-settings.d/51-claude-code-config-sandbox.json
          claude doctor < /dev/null | tee doctor.txt
          grep -q "Claude Code doctor" doctor.txt
          if grep -q "Invalid settings" doctor.txt; then exit 1; fi

  links:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --include-fragments
            --exclude '^https://claude\.ai/admin-settings'
            --exclude '^https://gitlab\.example\.com'
            './**/*.md'
