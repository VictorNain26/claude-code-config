name: evals

on:
  pull_request:
    paths: ["plugins/**", ".github/workflows/evals.yml"]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: [opus, sonnet]
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A Bash grant runs every command in the sandbox, which needs bubblewrap
      # and socat, and on Ubuntu 24.04+ an AppArmor profile for bwrap.
      - name: Set up the sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo systemctl reload apparmor
          fi

      # Secrets are not passed to pull requests from forks.
      - name: Run the eval suite
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not available; evals skipped."
            exit 0
          fi
          claude --version
          # Aliases are deliberate: the suite exists to catch model changes.
          # Record which model the alias resolved to this week.
          claude -p --model "$MODEL" --output-format stream-json --verbose "Reply ok" \
            | jq -r 'select(.subtype == "init") | "Resolved model: \(.model)"'
          claude plugin eval plugins/engineering-standards \
            --trust-plugin --scaffold --ablation none --keep-temp \
            --model "$MODEL" --judge-model claude-haiku-5-5 --threshold 0.9 --max-cost-usd 5 \
            --no-publish --json "results-$MODEL.json" \
            --allow-tools Edit Write WebFetch "Bash(python3 -m unittest*)"

      # Measures what the plugin adds over no plugin; reports, never gates.
      # Graders on the Skill tool are left out of both arms' scores.
      - name: Run the suite with and without the plugin
        if: ${{ !cancelled() && github.event_name != 'pull_request' && matrix.model == 'sonnet' }}
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not available; baseline skipped."
            exit 0
          fi
          resolved=$(claude -p --model "$MODEL" --output-format stream-json --verbose "Reply ok" \
            | jq -r 'select(.subtype == "init") | .model')
          status=0
          claude plugin eval plugins/engineering-standards \
            --trust-plugin --scaffold --ablation with-without \
            --model "$MODEL" --judge-model claude-haiku-5-5 --threshold 0 --max-cost-usd 5 \
            --no-publish --json results-baseline.json \
            --allow-tools Edit Write WebFetch "Bash(python3 -m unittest*)" || status=$?
          if [ -f results-baseline.json ]; then
            {
              echo "### Plugin effect ($resolved)"
              echo
              jq -r 'if .partial then "**Partial run: \(.partialReason // "see the log"). Leave it out of any trend.**\n" else empty end' results-baseline.json
              echo "| Case | With | Without | Δ | Skill loaded |"
              echo "|---|---|---|---|---|"
              jq -r '
                def r: if . == null then "n/a" else (. * 100 | round / 100 | tostring) end;
                .cases[]
                | ([.arms.with[]? | [.graders[]? | select(.name == "skill-fired") | .passed] | any] | map(select(.)) | length) as $loaded
                | "| \(.name) | \(.aggregates.score | r) | \(if .aggregates.delta == null then null else .aggregates.score - .aggregates.delta end | r) | \(.aggregates.delta | r) | \($loaded)/\(.arms.with | length) |"
              ' results-baseline.json
              echo
              jq -r '"Mean Δ: \(.aggregates.meanDelta // "n/a")"' results-baseline.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-results-${{ matrix.model }}
          path: |
            results-*.json
            plugins/engineering-standards/evals/results/
          if-no-files-found: ignore

      - name: Upload eval transcripts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-traces-${{ matrix.model }}
          path: /tmp/claude-eval-*/out/trace.jsonl
          if-no-files-found: ignore

